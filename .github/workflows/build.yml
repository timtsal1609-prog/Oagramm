name: Собрать APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Установить JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Собрать APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ls -la
      
      - name: Проверить файлы
        run: ls -R
