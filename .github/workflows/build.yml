name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          ls -R | head -40
          Z=$(find . -iname '*.zip' | head -1)
          if [ -n "$Z" ]; then unzip -q "$Z" -d proj; fi
          D=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "DIR=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: cd "$DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
